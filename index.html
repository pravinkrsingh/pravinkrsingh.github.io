<style>
:root{
  --accent:#2E5FA3; --accent-2:#1F4A86; --accent-soft:#EAF0F8; --navy:#14284A;
  --bg:#F5F7FB; --card:#FFFFFF; --ink:#17243A; --muted:#5A6880; --line:#E1E7F0;
  --chip:#EEF3FA; --chip-ink:#23497F; --ok:#2E8B57;
  --shadow:0 1px 2px rgba(20,40,74,.04),0 4px 14px rgba(20,40,74,.05);
  --shadow-hover:0 2px 4px rgba(20,40,74,.06),0 12px 26px rgba(20,40,74,.10);
  --font:"Segoe UI",Calibri,system-ui,-apple-system,Roboto,Arial,sans-serif; --r:14px;
}
[data-theme="dark"]{
  --accent:#86ABE3; --accent-2:#A9C3EC; --accent-soft:#1B2A43; --navy:#0B1527;
  --bg:#0E1626; --card:#152137; --ink:#E5ECF6; --muted:#9AA8BE; --line:#22324C;
  --chip:#1D2D49; --chip-ink:#C7D7F0; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hover:0 8px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.lift:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}
.grid{display:grid;gap:14px}
.cols2{grid-template-columns:repeat(2,1fr)} .cols3{grid-template-columns:repeat(3,1fr)}
.small{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);color:var(--chip-ink);font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.linkbtn:hover{text-decoration:underline}

/* nav */
header.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.brand{font-weight:700;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:9px}
.mono{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
[data-theme="dark"] .mono{color:#0E1626}
.nav-links{display:flex;gap:16px;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:13.5px}
.nav-links a:hover{color:var(--accent)}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center}

/* hero */
.hero{padding:44px 0 40px;background:radial-gradient(720px 320px at 100% 0%,var(--accent-soft),transparent 70%),radial-gradient(520px 260px at 0% 100%,var(--accent-soft),transparent 70%)}
.hero-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:34px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);color:var(--accent-2);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
h1{font-size:clamp(34px,5vw,48px);line-height:1.05;margin:14px 0 8px;letter-spacing:-.8px}
h1 span{color:var(--accent)}
.headline{font-size:18px;color:var(--accent-2);margin:0;font-weight:600}
.tagline{font-size:13.5px;color:var(--muted);margin:4px 0 14px}
.summary{margin:0 0 14px;max-width:600px;font-size:15px}
.open{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.open b{font-weight:600;margin-right:2px}
.open .chip{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:border-color .2s,transform .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#0E1626}
.btn .ico{width:15px;height:15px}
.pcard{padding:0;overflow:hidden;text-align:center}
.pcard .band{height:78px;background:linear-gradient(135deg,#2E5FA3 0%,#1F4A86 60%,#14284A 100%)}
.avatar{width:112px;height:112px;border-radius:50%;margin:-58px auto 0;border:4px solid var(--card);background:linear-gradient(135deg,#EAF0F8,#C9D9F2);display:grid;place-items:center;font-size:36px;font-weight:700;color:#1F4A86;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .sil{width:70%;height:70%;fill:#2E5FA3;opacity:.55;margin-top:18%}
.pcard .body{padding:12px 20px 18px}
.pcard .kicker{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ok);font-weight:700}
.pcard h3{margin:4px 0 2px;font-size:15.5px;line-height:1.35}
.facts{display:grid;gap:7px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);text-align:left;font-size:13px;color:var(--muted)}
.facts div{display:flex;align-items:center;gap:9px}
.facts .ico{width:16px;height:16px;color:var(--accent);flex:none}
.facts a{text-decoration:none;color:var(--ink)}
.facts a:hover{color:var(--accent)}

/* sections */
section{padding:40px 0;border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h2{font-size:22px;margin:0;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:19px;border-radius:2px;background:var(--accent)}
.sec-head p{margin:0;color:var(--muted);font-size:13px}

/* services */
.svc{display:flex;gap:13px;align-items:flex-start}
.svc .ib{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.svc h3{margin:1px 0 2px;font-size:14.5px}
.svc p{margin:0;font-size:13px;color:var(--muted)}

/* projects */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .tab.on{color:#0E1626}
.tab span{opacity:.7;font-weight:500;margin-left:3px}
.proj{padding:0;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/7;position:relative;display:grid;place-items:center;overflow:hidden;color:var(--accent);
  background:radial-gradient(circle at 20% 20%,rgba(46,95,163,.16),transparent 45%),radial-gradient(circle at 85% 80%,rgba(46,95,163,.12),transparent 40%),linear-gradient(135deg,#EAF0F8,#DCE7F5)}
[data-theme="dark"] .thumb{background:linear-gradient(135deg,#1B2A43,#14223A)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ph{width:54px;height:54px;border-radius:15px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.thumb .ph .ico{width:26px;height:26px}
.thumb .tag{position:absolute;top:10px;left:10px}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--card);color:var(--accent-2);border-radius:6px;padding:3px 7px;box-shadow:var(--shadow)}
.proj .body{padding:13px 16px 15px;display:flex;flex-direction:column;flex:1}
.proj h3{margin:0 0 3px;font-size:14.5px}
.proj p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.proj .bw{margin-top:auto;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
.proj .foot{margin-top:10px;display:flex;justify-content:flex-end}
.proj .foot a{font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.center{text-align:center;margin-top:16px}

/* experience timeline */
.tl{position:relative;display:grid;gap:12px}
.job{display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:start}
.logo{width:46px;height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--accent-2);box-shadow:var(--shadow);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.job .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.job h3{margin:0;font-size:15px}
.job .org{color:var(--accent);font-size:13.5px;font-weight:600}
.when{font-size:12px;color:var(--accent-2);background:var(--accent-soft);border-radius:999px;padding:2px 10px;white-space:nowrap;font-weight:600}
.job .note{font-size:12.5px;color:var(--muted)}
.job ul{margin:8px 0 0;padding-left:17px}
.job li{margin:3px 0;font-size:13.5px}
.job li b{color:var(--accent-2);font-weight:600}
.job li::marker{color:var(--accent)}
.job li.more{display:none}
.job.open li.more{display:list-item}

/* videos */
.vid{padding:0;overflow:hidden}
.vid .frame{position:relative;aspect-ratio:16/9;background:var(--navy)}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .empty{position:absolute;inset:0;display:grid;place-items:center;color:#C9D9F2;font-size:13px;text-decoration:none}
.vid .body{padding:12px 16px 14px}
.vid h3{margin:0 0 2px;font-size:14.5px}
.vid p{margin:0;font-size:13px;color:var(--muted)}
.vid a{display:inline-block;font-size:12.5px;font-weight:600;margin-top:6px;text-decoration:none}

/* tools + certs */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.card h4{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h4 .ico{width:17px;height:17px;color:var(--accent)}
.trow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:7px 0;align-items:start}
.trow .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:4px;line-height:1.35;overflow-wrap:break-word}
.certs{list-style:none;margin:0;padding:0}
.certs li{display:flex;gap:11px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.certs li.more{display:none}
.certs.open li.more{display:flex}
.certs .org{width:42px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none;font-size:10px;font-weight:800;letter-spacing:.02em;border:1px solid var(--line);overflow:hidden}
.certs .org img{width:100%;height:100%;object-fit:contain;padding:3px;background:#fff}
.certs .t{font-size:13.5px;font-weight:600;line-height:1.35}
.edu{margin:10px 0 0;font-size:12px;color:var(--muted)}

/* contact */
.contact-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:24px;align-items:start}
.contact-grid .lead{margin:0 0 12px;color:var(--muted)}
.clinks{display:grid;gap:8px;font-size:13.5px}
.clinks a{text-decoration:none;font-weight:600;display:flex;align-items:center;gap:8px}
.clinks .ico{width:16px;height:16px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
input,textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
input:focus,textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
form .full{grid-column:1/-1}
#formMsg{font-size:13px;color:var(--muted);align-self:center}
footer{border-top:1px solid var(--line);padding:16px 0 28px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media (max-width:900px){
  .hero-grid,.contact-grid,.split{grid-template-columns:1fr} .cols3{grid-template-columns:repeat(2,1fr)}
  .nav-links a{display:none} .pcard{max-width:420px}
}
@media (max-width:600px){
  .trow{grid-template-columns:1fr;gap:4px}
  .cols2,.cols3{grid-template-columns:1fr} form{grid-template-columns:1fr}
  .job{grid-template-columns:1fr} .logo{display:none}
}
@media print{
  :root{--bg:#fff;--card:#fff;--shadow:none}
  header.nav,.actions,#contact,#videos,.icon-btn,.tabs,.linkbtn,.thumb{display:none!important}
  body{font-size:11.5px} .hero{padding:6px 0;background:none} section{padding:12px 0}
  .card{break-inside:avoid;box-shadow:none} .proj{display:flex!important}
  .job li.more,.certs li.more{display:list-item!important} .certs li.more{display:flex!important}
  a{color:inherit;text-decoration:none}
}
</style>
</head>

  <section id="projects"><div class="wrap">

  <section id="experience"><div class="wrap">

        <div style="margin-top:8px" id="certMore"></div><p class="edu" id="eduNote"></p></div>

  </div></section>

  <section id="contact"><div class="wrap contact-grid">

  </div></section>
</main>

<footer><div class="wrap"><span id="copy"></span><span id="footNote"></span></div></footer>

const list = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);
const chips = s => `<div class="chips">${list(s).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>`;
const isImg = s => /\.(png|jpe?g|webp|gif|svg)(\?|$)/i.test(String(s || "")) || /^https?:\/\//.test(String(s || ""));
const initials = s => String(s || "").replace(/\(.*?\)/g, "").split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const lbl = x => { const m = String(x).match(/^([^:]{2,32}):\s([A-Z0-9].+)$/); return m ? `<b>${esc(m[1])}:</b> ${esc(m[2])}` : esc(x); };
const ext = (url, label, cls = "btn") => `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`;

    const b = String(j.bullets || "").split("\n").map(x => x.trim()).filter(Boolean);
    const vis = i === 0 ? 6 : /present/i.test(j.end) ? 99 : 1;
    const when = [j.start, j.end].filter(Boolean).join(" – ") + (j.location ? ` · ${j.location}` : "");
    const logo = j.logo && isImg(j.logo) ? `<img src="${esc(j.logo)}" alt="">` : esc(j.logo || initials(j.org));
    return `<div class="job" id="job${i}"><div class="logo">${logo}</div><div class="card">
      <div class="top"><div><h3>${esc(j.role || j.org)}</h3>${j.role ? `<div class="org">${esc(j.org)}${j.note ? ` <span class="note">· ${esc(j.note)}</span>` : ""}</div>` : ""}</div>
      <span class="when">${esc(when)}</span></div>
      ${b.length ? `<ul>${b.map((x, k) => `<li${k >= vis ? ' class="more"' : ""}>${lbl(x)}</li>`).join("")}</ul>` : ""}
      ${b.length > vis ? `<button class="linkbtn" style="margin-top:6px" onclick="toggleJob(${i},this)">Show ${b.length - vis} more</button>` : ""}</div></div>`;
  }).join("");

  const vids = D.videos || [];
  $("videos").style.display = vids.length ? "" : "none";
  $("videoGrid").style.gridTemplateColumns = vids.length === 1 ? "minmax(0,720px)" : "";
  $("videoGrid").innerHTML = vids.map(v => {
    const e = embed(v.url);
    const frame = !v.url ? `<div class="empty">▶ Video link to be added</div>`
      : e.type === "video" ? `<video controls preload="metadata" src="${esc(e.src)}"></video>`
      : e.type === "iframe" ? `<iframe src="${esc(e.src)}" title="${esc(v.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`
      : `<a class="empty" href="${esc(v.url)}" target="_blank" rel="noopener">▶ Watch the video</a>`;
    return `<div class="card vid"><div class="frame">${frame}</div><div class="body"><h3>${esc(v.title)}</h3><p>${esc(v.description)}</p>
      ${v.link ? `<a href="${esc(v.link)}" target="_blank" rel="noopener">${esc(v.link_label || "Visit")} →</a>` : ""}</div></div>`;
  }).join("");

  $("toolsHead").innerHTML = `${icon("tool")} Key tools`;
  $("toolRows").innerHTML = (D.skills || []).map(s => `<div class="trow"><span class="lbl">${esc(s.group)}</span>${chips(s.items)}</div>`).join("");

  const certs = D.certifications || [];
  $("certHead").innerHTML = `${icon("award")} Certifications`;
  $("certList").innerHTML = certs.map((c, k) => `<li${k >= 6 ? ' class="more"' : ""}><span class="org">${c.logo && isImg(c.logo) ? `<img src="${esc(c.logo)}" alt="">` : esc(c.logo || initials(c.issuer))}</span>
    <div><div class="t">${esc(c.title)}</div><div class="small">${esc([c.issuer, c.date].filter(Boolean).join(" · "))}</div></div></li>`).join("");
  $("certMore").innerHTML = certs.length > 6 ? `<button class="linkbtn" onclick="toggleCerts(this)">+ ${certs.length - 6} more</button>` : "";
  const edu = (D.education || []).filter(e => e.title);
  $("eduNote").textContent = edu.length ? "Education: " + edu.map(e => [e.title, e.org, e.years].filter(Boolean).join(", ")).join(" · ") : "";
  $("certCard").style.display = certs.length || edu.length ? "" : "none";

  let c = "";
  if (P.email) c += `<a href="mailto:${esc(P.email)}">${icon("mail")} ${esc(P.email)}</a>`;
  if (P.email_2) c += `<a href="mailto:${esc(P.email_2)}">${icon("mail")} ${esc(P.email_2)}</a>`;
  if (P.website) c += ext(P.website, `${icon("globe")} ${esc(P.website.replace(/^https?:\/\//, "").replace(/\/$/, ""))}`, "");
  if (P.learning_portal) c += ext(P.learning_portal, `${icon("cap")} ${esc(P.learning_portal.replace(/^https?:\/\//, "").replace(/\/$/, ""))}`, "");
  $("contactLinks").innerHTML = c;

  $("copy").textContent = `© ${new Date().getFullYear()} ${P.name}`;
  $("footNote").textContent = [P.built_with ? "Built with " + P.built_with : "", SHEET_API ? P.footer_note : ""].filter(Boolean).join(" · ");
  window.__EMAIL = P.email;
}

function renderProjects(){
  const ps = DATA.projects || [];
  const featured = ps.filter(p => /^y/i.test(String(p.featured || "")));
  const groups = [...new Set(ps.map(p => p.group).filter(Boolean))];
  const tabs = (featured.length ? ["Highlights"] : []).concat(groups, ["All"]);
  if (!tabs.includes(TAB)) TAB = tabs[0];
  $("tabs").innerHTML = tabs.map(t => {
    const n = t === "Highlights" ? featured.length : t === "All" ? ps.length : ps.filter(p => p.group === t).length;
    return `<button class="tab${t === TAB ? " on" : ""}" onclick="setTab('${esc(t)}')">${esc(t)}<span>${n}</span></button>`;
  }).join("");
  const shown = TAB === "Highlights" ? featured : TAB === "All" ? ps : ps.filter(p => p.group === TAB);
  $("projGrid").innerHTML = shown.map(p => `<div class="card proj lift">
    <div class="thumb">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">` : `<div class="ph">${icon(p.icon)}</div>`}
      ${p.badge ? `<span class="tag">${esc(p.badge)}</span>` : ""}</div>
    <div class="body"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>
      ${p.tags ? `<div class="bw">Built with</div>${chips(p.tags)}` : ""}${p.link ? `<div class="foot"><a href="${esc(p.link)}" target="_blank" rel="noopener">Visit →</a></div>` : ""}</div></div>`).join("");
}
function setTab(t){ TAB = t; renderProjects(); }
function toggleJob(i, btn){ const j = $("job" + i); j.classList.toggle("open"); btn.textContent = j.classList.contains("open") ? "Show less" : `Show ${j.querySelectorAll("li.more").length} more`; }
function toggleCerts(btn){ const l = $("certList"); l.classList.toggle("open"); btn.textContent = l.classList.contains("open") ? "Show less" : `+ ${l.querySelectorAll("li.more").length} more`; }

/* Turns a YouTube, Vimeo, Google Drive or .mp4 link into something playable on the page */
function embed(url){
  url = String(url || "").trim();
  if (!url) return { type: "none" };
  let m;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/)))
    return { type: "iframe", src: `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0` };
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return { type: "iframe", src: `https://player.vimeo.com/video/${m[1]}` };
  if ((m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/))) return { type: "iframe", src: `https://drive.google.com/file/d/${m[1]}/preview` };
  if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return { type: "video", src: url };
  return { type: "link" };
}

/* Contact form: posts to the Apps Script if set, otherwise opens the visitor's email app */
$("contactForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target, msg = $("formMsg");
  const body = { name: f.name.value, email: f.email.value, message: f.message.value };
  if (!SHEET_API) {
    location.href = `mailto:${window.__EMAIL}?subject=${encodeURIComponent("Message from " + body.name)}&body=${encodeURIComponent(body.message + "\n\n" + body.name + " <" + body.email + ">")}`;
    return;
  }
  msg.textContent = "Sending…";
  try {
    await fetch(SHEET_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body) });
    msg.textContent = "Thanks, your message has been sent."; f.reset();
  } catch (e) { msg.textContent = "Could not send. Please email me directly."; }
});

/* Print: show every project */
window.addEventListener("beforeprint", () => { if (TAB !== "All") { window.__tab = TAB; setTab("All"); } });
window.addEventListener("afterprint", () => { if (window.__tab) { setTab(window.__tab); window.__tab = null; } });

/* Theme */
const savedTheme = (() => { try { return localStorage.getItem("theme"); } catch (e) { return null; } })();
if (savedTheme === "dark") document.documentElement.dataset.theme = "dark";
$("themeBtn").onclick = () => {
  const d = document.documentElement.dataset.theme === "dark" ? "" : "dark";
  document.documentElement.dataset.theme = d;
  try { localStorage.setItem("theme", d); } catch (e) {}
};

/* Start: draw built-in content at once, then swap in Sheet content if available */
render(DEFAULT_DATA);
if (SHEET_API) fetch(SHEET_API).then(r => r.json()).then(d => { if (d && d.profile && d.profile.name) render(d); }).catch(() => {});
</script>
